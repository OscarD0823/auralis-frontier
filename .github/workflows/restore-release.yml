name: Verify and restore release transfers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        default: v0.14.0
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct exact tested files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p transfer
          gh release download "$RELEASE_TAG" --pattern '*.auralis-transfer*' --dir transfer
          python scripts/restore-release-delta.py transfer/*.auralis-transfer*
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" Auralis-Frontier-Android.apk Auralis-Frontier-Windows-Setup.exe --clobber

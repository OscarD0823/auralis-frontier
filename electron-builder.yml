appId: com.oscard.auralis.frontier
productName: Auralis Frontier
electronVersion: 44.7.0
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - package.json
  - '!node_modules/**/*'
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Auralis-Frontier-Windows-Setup.exe

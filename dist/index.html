<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182a2c"><meta name="description" content="Auralis Frontier: construye una civilización, dirige su ejército y explora un mundo procedural en 3D."><title>Auralis Frontier · Horizontes</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./horizons.css"><link rel="stylesheet" href="./frontier-shell.css"></head>
<body><div class="horizon-app">
<header class="top"><a class="brand" href="./" aria-label="Auralis Frontier"><span class="brand-emblem">A</span><span>AURALIS<small>F R O N T I E R</small></span></a><div id="resources" class="stockbar" aria-label="Inventario local"></div><button data-action="guide" class="icon-button guide-button" aria-label="Guía y objetivos">?</button><button data-action="settings" class="icon-button settings" aria-label="Guardado, descargas y ajustes">⚙</button></header>
<main id="field" class="field"><canvas id="game" aria-label="Mundo de estrategia en 3D. Selecciona unidades; clic derecho para ordenar. Construir abre el catálogo de edificios." tabindex="0"></canvas>
<div id="model-loading" style="position:absolute;inset:40% 0 auto;text-align:center;color:#e5dbbb">Cargando modelos y texturas…</div><div class="world-heading"><div id="world-kicker" class="eyebrow"></div><h1 id="world-title">Aurora</h1><p id="world-info"></p><button id="vital-status" class="vital-status" data-tab="city"></button></div><div id="alert" class="event-alert" hidden></div><span id="render-mode" class="render-mode"></span>
<div class="camera"><button data-action="zoom-in" aria-label="Acercar">+</button><button data-action="zoom-out" aria-label="Alejar">−</button><button data-action="center" aria-label="Centrar en las unidades">⌖</button><details class="camera-more"><summary aria-label="Más controles de cámara">⋯</summary><div><button data-action="pan" aria-label="Mover la cámara">✥</button><button data-action="rotate-left" aria-label="Girar cámara a la izquierda" title="Girar · Q">↶</button><button data-action="rotate-right" aria-label="Girar cámara a la derecha" title="Girar · E">↷</button><button data-action="tilt" aria-label="Cambiar inclinación de cámara">◩</button></div></details></div>
<div class="mini-wrap"><button data-action="toggle-minimap" aria-label="Mostrar u ocultar minimapa" class="mini-toggle">Mapa <span>⌃</span></button><div id="mini-content"><canvas id="minimap" width="180" height="130" aria-label="Minimapa: toca para desplazar la cámara"></canvas><small id="map-status"></small></div></div>
<section id="selection-card" class="selection-card" aria-label="Selección actual" hidden><div id="selection-summary" class="selection-summary"></div><div id="work-status" class="work-status" hidden></div><div id="commands" class="commands" role="toolbar" aria-label="Órdenes de la selección"></div></section>
<div id="tool-banner" class="tool-banner" hidden></div><section id="build-menu" class="build-menu" aria-label="Catálogo de construcción" hidden><header class="catalog-header"><div><span class="eyebrow">DISEÑA TU CIVILIZACIÓN</span><h2>Construir</h2></div><label class="catalog-search"><span class="sr-only">Buscar en esta categoría</span><input id="build-search" type="search" placeholder="Buscar por nombre o función…" autocomplete="off"></label><label class="locked-toggle"><input id="show-locked" type="checkbox">Ver bloqueados</label><button data-action="close-build" class="icon-button" aria-label="Cerrar construcción">×</button></header><div id="build-categories" class="build-categories" role="tablist" aria-label="Tipos de construcción"></div><div id="dock" class="build-dock"></div></section>
<section id="panel" class="panel" aria-label="Gestión de la civilización" hidden></section><aside id="sidebar" class="sidebar" aria-label="Detalles de la selección" hidden></aside>
<nav class="nav" aria-label="Secciones"><button data-tab="base" class="active" title="Volver al territorio"><span data-icon="home"></span><small>Territorio</small></button><button data-action="build-menu" class="build-main"><span data-icon="build"></span><small>Construir</small></button><button data-tab="army"><span data-icon="army"></span><small>Ejército</small></button><button data-tab="city"><span data-icon="city"></span><small>Pueblo</small></button><button data-action="more-menu" aria-expanded="false"><span data-icon="more"></span><small>Gestión</small></button><div id="nav-more" class="nav-more" hidden><button data-tab="science"><span data-icon="science"></span>Ciencia</button><button data-tab="species"><span data-icon="species"></span>Pueblos</button><button data-tab="world"><span data-icon="world"></span>Horizontes</button><button data-tab="people"><span data-icon="pact"></span>Diplomacia</button><button data-tab="era"><span data-icon="era"></span>Eras</button><button data-tab="depth"><span data-icon="depth"></span>Subsuelo</button><button data-tab="routes"><span data-icon="road"></span>Suministros</button><span id="save-status" class="save-indicator">Cargando</span></div></nav>
<div class="hint" id="hint">Clic derecho: ordenar · Shift: añadir orden · Espacio: centrar</div></main></div><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="modal"><div id="modal-body"></div></dialog><input id="import" type="file" accept=".json,application/json" hidden><script type="module" src="./horizons-ui.js"></script></body></html>
